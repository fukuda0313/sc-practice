version: "3"

services:
  dns_server:
    image: ubuntu/bind9:latest
    container_name: dns_server
    restart: always
    ports:
      - "53:53/udp"
    volumes:
      - ./bind:/etc/bind
    environment:
      - BIND9_USER=root

  web_server:
    image: nginx
    container_name: web_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html

  attacker:
    image: kalilinux/kali-rolling
    container_name: attacker
    stdin_open: true
    tty: true
